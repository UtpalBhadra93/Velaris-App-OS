{{- if not .Values.databaseSecret.existingSecret }}
# The database URL, out of every Deployment's env block.
#
# Kept in a Secret because it carries the password: rendered inline it is
# readable by anyone who can `get deployments`, which on most clusters is a much
# wider group than `get secrets`. Set `databaseSecret.existingSecret` to bring
# your own (an external secret manager, a sealed secret) and this renders nothing.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helix.fullname" . }}-db
  labels: { app: {{ include "helix.name" . }} }
type: Opaque
stringData:
  {{ include "helix.dbSecretKey" . }}: {{ include "helix.databaseUrl" . | quote }}
{{- end }}
