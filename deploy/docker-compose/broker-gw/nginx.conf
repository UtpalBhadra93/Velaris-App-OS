# Velaris Marketplace Layer-2 — apps-network gateway.
#
# The ONLY bridge between the internal apps network (where publisher
# containers and bot containers run with no route out of the host) and the
# platform. It proxies an explicit allowlist of paths to the host nginx's
# dedicated edge listener (172.31.101.1:8210, bound on the velaris-apps-edge
# gateway interface). Every other path 404s here, and the host listener
# serves the same allowlist and nothing else: two layers both have to be wrong
# before a container can reach any other API.
#
# ONE bridge with a named allowlist, not one bridge per feature: a second
# dual-homed container would be a second place to get the trust boundary
# wrong, and the paths below are already the whole of what a container may
# reach. Both authenticate on their own credential (the broker's scoped token,
# the bot's per-job token) — this is defence in depth, not the auth boundary.
worker_processes 1;
events { worker_connections 128; }
http {
    server {
        listen 80;

        # Marketplace Layer-2: the scoped read-only data broker.
        location /api/v1/broker {
            proxy_pass http://172.31.101.1:8210;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # RPA bots: how a container returns its work. Exactly `result` and
        # `progress` on one job id — NOT the /bots registry, which is an
        # operator surface and must not be reachable from a container.
        location ~ "^/api/v1/bots/jobs/[0-9a-fA-F-]{36}/(result|progress)$" {
            proxy_pass http://172.31.101.1:8210;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        location / { return 404; }
    }
}
