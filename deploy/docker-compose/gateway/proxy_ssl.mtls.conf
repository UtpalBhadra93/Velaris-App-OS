# Internal TLS, ON (roadmap #18) — mount this over proxy_ssl.conf.
#
# The gateway is the CLIENT on every internal hop. It presents gateway.crt so
# each service can verify who is calling, and it verifies the service against
# the same internal CA so a process that stole a port cannot answer for one.
#
# `proxy_ssl_verify on` is the whole point of the exercise. Without it this is
# encryption with no authentication — which is worse than plaintext, because it
# looks like it is doing something.
proxy_ssl_certificate         /etc/nginx/tls/gateway.crt;
proxy_ssl_certificate_key     /etc/nginx/tls/gateway.key;
proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
proxy_ssl_verify              on;
proxy_ssl_verify_depth        2;
proxy_ssl_protocols           TLSv1.2 TLSv1.3;
proxy_ssl_session_reuse       on;

# The services present certificates whose CN is the service name, but the
# gateway reaches them on 127.0.0.1 — which is in every SAN list precisely so
# this check can stay ON rather than being disabled to make it work.
proxy_ssl_name                localhost;
proxy_ssl_server_name         on;
