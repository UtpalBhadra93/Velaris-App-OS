# Auto-generated by HELIX setup wizard
# Only includes services you selected
services:
  # ── Temporal (always required) ──
  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      # Default "temporal" kept as fallback so existing setups still boot, but
      # set VELARIS_TEMPORAL_DB_PASSWORD in your .env — weak default creds plus
      # an exposed port were the 2026-06-19 cryptojacker entry vector.
      POSTGRES_PASSWORD: ${VELARIS_TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    # NO published port: only the `temporal` container connects to this DB, over
    # the internal compose network (POSTGRES_SEEDS=temporal-db). Never expose a
    # database to the host or network unless something off-Docker must reach it.
    volumes: [temporal-db:/var/lib/postgresql/data]
    # Every long-running service here carries `restart: unless-stopped`. On
    # 2026-08-05 only the five that already had it survived a Docker daemon
    # restart; the DB, cache, broker and vault stayed Exited(255) while the
    # case-service systemd unit came back and served 500s against a dead
    # Postgres. "unless-stopped" (not "always") is deliberate: a container you
    # stopped on purpose — or that stop-velaris.sh brought down — stays down.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25
    depends_on:
      temporal-db: { condition: service_healthy }
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${VELARIS_TEMPORAL_DB_PASSWORD:-temporal}
      - POSTGRES_SEEDS=temporal-db
    # Loopback-only: the host case-service reaches Temporal at 127.0.0.1:7233.
    # Not reachable from the network.
    ports: ["127.0.0.1:7233:7233"]
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    # Loopback-only admin UI. Reach it via SSH tunnel, not over the network.
    ports: ["127.0.0.1:8233:8080"]
    restart: unless-stopped

  velaris-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velaris
      POSTGRES_PASSWORD: ${VELARIS_DB_PASSWORD:?not set - run scripts/secrets-render.sh or pass --env-file ~/helix/.env}
      POSTGRES_DB: velaris
    # Loopback-only: the host case-service connects at 127.0.0.1:5432. This is
    # your application database — it must NEVER be reachable from the network.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [velaris-db:/var/lib/postgresql/data]
    # THE one that took the platform down on 2026-08-05. Without this, a Docker
    # daemon restart leaves the application database Exited(255) and every login
    # returns 500.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velaris"]
      interval: 5s
      retries: 10

  cache:
    # Valkey = Linux Foundation fork of Redis, BSD-3 (Redis 7.4+ moved to
    # SSPL). Protocol-compatible drop-in: same port, same client library.
    # Architecture Report §11 mandates this swap.
    image: valkey/valkey:8-alpine
    # Loopback-only: host case-service reaches the cache at 127.0.0.1:6379.
    ports: ["127.0.0.1:6379:6379"]
    volumes: [cache-data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  events:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      # TWO listeners, deliberately. A single listener advertising `events:9092`
      # works for containers and is unreachable from the host: a host client
      # bootstraps fine on 127.0.0.1 and then fails DNS on the advertised name.
      # case-service runs on the HOST in this deployment, so it needs an
      # externally-advertised address it can actually resolve.
      - --kafka-addr INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr INTERNAL://events:9092,EXTERNAL://127.0.0.1:19092
    # Loopback-only: host case-service reaches the broker at 127.0.0.1:19092;
    # containers use events:9092 on the compose network.
    ports: ["127.0.0.1:9092:9092", "127.0.0.1:19092:19092"]
    volumes: [events-data:/var/lib/redpanda/data]
    restart: unless-stopped


  # search (OpenSearch) removed 2026-06-12 — zero references in platform
  # code; it never served a request. Re-add deliberately if a search
  # feature ships, don't resurrect from habit.

  # auth (Keycloak) removed 2026-06-12 — login is the built-in stack
  # (/api/v1/auth/login: bcrypt + RS256 + passkeys; auth_mode="jwt").
  # The OIDC code path (auth_mode="oidc" + oidc_discovery_url) stays in the
  # platform; re-add an IdP container deliberately when a customer needs
  # bring-your-own-IdP, not from habit.

  ollama:
    image: ollama/ollama:latest
    # Loopback-only: host case-service reaches the model server at 127.0.0.1:11434.
    ports: ["127.0.0.1:11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
      - ../../models:/models:ro
    entrypoint: ["/bin/bash", "/models/.ollama-init.sh"]
    restart: unless-stopped


  # ── HxMeet P2 — embedded driver (self-hosted LiveKit SFU, Apache-2.0) ──
  livekit:
    image: livekit/livekit-server:v1.13
    container_name: velaris-livekit
    # Host networking on purpose (same pattern as the gateway):
    #  (a) WebRTC media needs UDP ports on the host interface, and host-mode
    #      ports stay under UFW — bridge-published ports bypass it (the
    #      2026-06-19 incident class);
    #  (b) webhooks must reach the loopback-only API gateway (127.0.0.1:8200).
    # Signalling binds all interfaces so browsers on OTHER devices can join;
    # UFW gates exposure (allow 7880-7881/tcp + 50700-50720/udp from LAN only).
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          port_range_start: 50700
          port_range_end: 50720
          use_external_ip: false
        # P3: egress dispatch runs over the existing Valkey (loopback-published).
        redis:
          address: 127.0.0.1:6379
        # Defaults exist only so a fresh install can `compose up openbao`
        # before the first secrets-render (compose interpolates the whole
        # file). They bind loopback-only, and case-service without the
        # rendered VELARIS_CASE_LIVEKIT_* vars keeps the embedded driver
        # fail-closed (501) — mismatched keys can't mint a joinable token.
        keys:
          ${VELARIS_CASE_LIVEKIT_API_KEY:-devkey}: ${VELARIS_CASE_LIVEKIT_API_SECRET:-devsecret_replace_me_00000000000000}
        webhook:
          api_key: ${VELARIS_CASE_LIVEKIT_API_KEY:-devkey}
          urls:
            - http://127.0.0.1:8200/api/v1/meet/webhook/livekit
    restart: unless-stopped

  # ── HxMeet P3 — recording egress worker (separate Apache-2.0 service) ──
  # Renders the room in headless Chrome and writes the MP4 to /out — the
  # shared dir case-service ingests from (sha256 > tenant-DEK seal > case
  # document > audit chain, then the file is deleted). Host networking for
  # the same reasons as livekit; SYS_ADMIN is required by Chrome's sandbox.
  livekit-egress:
    image: livekit/egress:v1.13
    container_name: velaris-livekit-egress
    network_mode: host
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: 127.0.0.1:6379
        api_key: ${VELARIS_CASE_LIVEKIT_API_KEY:-devkey}
        api_secret: ${VELARIS_CASE_LIVEKIT_API_SECRET:-devsecret_replace_me_00000000000000}
        ws_url: ws://127.0.0.1:7880
        insecure: true
    volumes:
      - ${VELARIS_CASE_MEET_RECORDINGS_DIR:-/tmp/velaris-recordings}:/out
    restart: unless-stopped

# The API services run on the HOST in this deployment (start-velaris.sh or the
# systemd units), which is why these are commented out. Kept, and kept current,
# so the container path stays a change of two lines rather than a rediscovery.
#
# Note the build context: since 13b every service depends on `velaris-shared`
# (services/_shared), a path dependency that a context rooted at the service
# directory cannot see. The context is the REPOSITORY ROOT for all four.
#
#  case-service:
#    build:
#      context: ../..
#      dockerfile: services/case-service/Dockerfile
#    ports: ["8201:8200"]
#    depends_on:
#      velaris-db: { condition: service_healthy }
#      temporal: { condition: service_started }
#    environment:
#      VELARIS_CASE_DATABASE_URL: postgresql+asyncpg://velaris:velaris_dev_password@velaris-db:5432/velaris
#      VELARIS_CASE_TEMPORAL_HOST: temporal:7233
#      VELARIS_CASE_SERVICE_PORT: "8200"
#      FORWARDED_ALLOW_IPS: "127.0.0.1"     # the gateway is host-networked
#
#  analytics-service:                        # roadmap 13c
#    build:
#      context: ../..
#      dockerfile: services/analytics-service/Dockerfile
#    ports: ["8202:8202"]
#    depends_on:
#      velaris-db: { condition: service_healthy }
#    environment:
#      VELARIS_CASE_DATABASE_URL: postgresql+asyncpg://velaris:velaris_dev_password@velaris-db:5432/velaris
#      FORWARDED_ALLOW_IPS: "127.0.0.1"
#
#  hxgraph-service:                          # roadmap 13d
#    build:
#      context: ../..
#      dockerfile: services/hxgraph-service/Dockerfile
#    ports: ["8203:8203"]
#    depends_on:
#      velaris-db: { condition: service_healthy }
#    environment:
#      VELARIS_CASE_DATABASE_URL: postgresql+asyncpg://velaris:velaris_dev_password@velaris-db:5432/velaris
#      FORWARDED_ALLOW_IPS: "127.0.0.1"
#
#  hxmigrate-service:                        # roadmap 13e
#    build:
#      context: ../..
#      dockerfile: services/hxmigrate-service/Dockerfile
#    ports: ["8204:8204"]
#    depends_on:
#      velaris-db: { condition: service_healthy }
#    environment:
#      VELARIS_CASE_DATABASE_URL: postgresql+asyncpg://velaris:velaris_dev_password@velaris-db:5432/velaris
#      FORWARDED_ALLOW_IPS: "127.0.0.1"

  # ── API Gateway (roadmap #13a — stable /api/v1 prefix + discovery) ──
  # Single ingress; routes by sub-prefix to the owning service. All seams
  # resolve to case-service today (zero behaviour change); each flips to its
  # own service as services are extracted (#13c-e).
  gateway:
    image: nginx:1.27-alpine
    container_name: velaris-gateway
    # Host networking: the gateway reaches case-service on the host loopback
    # (127.0.0.1:8201), which lets case-service bind loopback-ONLY so it cannot
    # be reached around the gateway. nginx itself listens on 127.0.0.1:8200
    # (see gateway/nginx.conf) — nothing is exposed on a public interface.
    network_mode: host
    volumes:
      # A TEMPLATE, not the final config: the nginx image's entrypoint runs
      # envsubst over everything in /etc/nginx/templates and writes the result
      # to /etc/nginx/. That is how the workload-identity secret (#18) reaches
      # the config without ever being committed to the repository.
      - ./gateway/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      # Internal TLS (#18) is a MOUNT swap, not a config edit. ON since
      # 2026-08-24: the mTLS include is mounted over proxy_ssl.conf and the
      # certificate directory comes with it. This must agree with
      # VELARIS_UPSTREAM_SCHEME below — nginx cannot branch on an environment
      # variable, so the two are separate knobs and half a change gives an
      # immediate 502 rather than a silent downgrade to plaintext.
      # To turn it back off: restore the plain mount and set the scheme to http.
      # - ./gateway/proxy_ssl.conf:/etc/nginx/proxy_ssl.conf:ro
      - ./gateway/proxy_ssl.mtls.conf:/etc/nginx/proxy_ssl.conf:ro
      - ../tls/certs:/etc/nginx/tls:ro
    environment:
      # Only this variable is substituted, so a `$host` or `$remote_addr` in the
      # template survives untouched.
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: ".template"
      NGINX_ENVSUBST_OUTPUT_DIR: "/etc/nginx"
      NGINX_ENVSUBST_FILTER: "VELARIS_GATEWAY_IDENTITY_SECRET|VELARIS_UPSTREAM_SCHEME|VELARIS_CASE_SERVICE_PORT|VELARIS_CASE_PORT|VELARIS_ANALYTICS_PORT|VELARIS_HXGRAPH_PORT|VELARIS_HXMIGRATE_PORT"
      VELARIS_GATEWAY_IDENTITY_SECRET: "${VELARIS_GATEWAY_IDENTITY_SECRET:-}"
      # http unless internal TLS is on. Substituted into every proxy_pass, so
      # the scheme and the proxy_ssl block can never disagree.
      VELARIS_UPSTREAM_SCHEME: "${VELARIS_UPSTREAM_SCHEME:-http}"
      # Ports, with the historical values as defaults so an install that sets
      # none of them renders exactly the config it rendered before.
      VELARIS_CASE_SERVICE_PORT: "${VELARIS_CASE_SERVICE_PORT:-8200}"
      VELARIS_CASE_PORT: "${VELARIS_CASE_PORT:-8201}"
      VELARIS_ANALYTICS_PORT: "${VELARIS_ANALYTICS_PORT:-8202}"
      VELARIS_HXGRAPH_PORT: "${VELARIS_HXGRAPH_PORT:-8203}"
      VELARIS_HXMIGRATE_PORT: "${VELARIS_HXMIGRATE_PORT:-8204}"
    restart: unless-stopped

  # >>> P23 observability services
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: velaris-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - velaris-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles: [observability]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: velaris-otel-collector
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
    profiles: [observability]
  # <<< P23 observability services

  # >>> P24 document storage
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: velaris-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=velaris
      - MINIO_ROOT_PASSWORD=${VELARIS_MINIO_PASSWORD:?not set - run scripts/secrets-render.sh or pass --env-file ~/helix/.env}
    # Loopback-only: API (9000) for the host case-service, console (9001) via
    # SSH tunnel. Object storage must not be network-reachable.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - velaris-minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    # NO restart policy on purpose: this is a one-shot bucket-create that exits
    # 0. A restart policy would re-run it on every daemon start forever.
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      - MC_VELARIS_PASSWORD=${VELARIS_MINIO_PASSWORD:?not set - run scripts/secrets-render.sh or pass --env-file ~/helix/.env}
    entrypoint: >
      /bin/sh -c "
      mc alias set velaris http://minio:9000 velaris $${MC_VELARIS_PASSWORD};
      mc mb --ignore-existing velaris/velaris-docs;
      exit 0;
      "
  # <<< P24 document storage

  # >>> P25b mailpit (local dev SMTP/IMAP)
  mailpit:
    image: axllent/mailpit:latest
    container_name: velaris-mailpit
    # Loopback-only. mailpit accepts any SMTP auth (MP_SMTP_AUTH_ACCEPT_ANY) and
    # must never be network-reachable — it would be an open relay / data leak.
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:1143:1143"   # IMAP
      - "127.0.0.1:8025:8025"   # Web UI
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
      - MP_DATABASE=/data/mailpit.db
      - MP_MAX_MESSAGES=5000
    volumes:
      - velaris-mailpit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      retries: 5
  # <<< P25b mailpit

  # >>> Group K: OpenBao secrets manager
  # Host port 8350 (8200 belongs to case-service). Loopback-only binding:
  # nothing off-host can reach the secrets API. The app does NOT talk to
  # OpenBao at runtime — the agent renders .env at platform start.
  openbao:
    image: openbao/openbao:2
    container_name: velaris-openbao
    command: ["bao", "server", "-config=/openbao/config/server.hcl"]
    cap_add:
      - IPC_LOCK        # mlock: keep secrets out of swap
    ports:
      - "127.0.0.1:8350:8200"
    volumes:
      - openbao-data:/openbao/data
      # The image declares VOLUME for /openbao/file and /openbao/logs (upstream
      # defaults we don't use — storage is file@/openbao/data per server.hcl).
      # Unmapped, Docker mints a fresh anonymous volume for each on every `up`
      # and orphans the previous pair, so restarts leak 2 dead volumes forever.
      # Naming them pins the churn to these two, reused across restarts.
      - openbao-file:/openbao/file
      - openbao-logs:/openbao/logs
      - ../openbao/server.hcl:/openbao/config/server.hcl:ro
    # Comes back SEALED after any restart — by design, that is what a vault does.
    # scripts/secrets-unseal.sh is what reopens it; start-velaris.sh calls it.
    # The platform runs fine sealed (.env is already rendered), so an unattended
    # reboot recovers the API even though day-2 secret writes wait for a human.
    restart: unless-stopped
    healthcheck:
      # uninit/sealed/standby remapped to 200 — "API up" is the health bar;
      # seal state is handled by the start script, not the orchestrator
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbycode=200"]
      interval: 10s
      retries: 5
  # <<< Group K

  # >>> Marketplace Layer-2 — app-container network path
  # Publisher containers and bot containers join ONLY velaris-apps (internal:
  # no route out of the host — egress-DROP by construction, no in-container
  # iptables needed). The broker gateway is the single bridge: it also joins
  # the edge network and proxies an explicit path allowlist (/api/v1/broker,
  # and the bot job result/progress pair) to the host nginx's dedicated
  # listener on the edge gateway IP (172.31.101.1:8210). App containers are
  # NEVER on the edge network.
  #
  # `bot_result_base_url` names THIS container. A host-networked container
  # (velaris-gateway) has no DNS record on velaris-apps, so it cannot be the
  # bridge however correct its routes look.
  broker-gw:
    image: nginx:1.27-alpine
    container_name: velaris-broker-gw
    volumes:
      - ./broker-gw/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - velaris-apps
      - velaris-apps-edge
    restart: unless-stopped

  # Egress host-filter gateway: the ONLY way OUT for app containers, and only
  # for those holding a per-container credential minted at grant approval.
  # CONNECT-only proxy (TLS end-to-end, no MITM): authenticates, allows exactly
  # the admin-granted domains, refuses IP-literals + anything resolving to a
  # private address, and audit-logs every attempt. Dual-homed: velaris-apps
  # (reachable by apps) + the NATted default network (its way out). Runs with
  # the same hardening posture the app containers get. The platform writes
  # conf/allowlist.json (re-read per request — revocation is instant) and
  # ingests log/ into marketplace_network_log.
  egress-gw:
    image: python:3.12-alpine
    container_name: velaris-egress-gw
    command: ["python", "/opt/proxy.py"]
    user: "65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    volumes:
      - ./egress-gw/proxy.py:/opt/proxy.py:ro
      - ./egress-gw/conf:/etc/velaris-egress:ro
      - ./egress-gw/log:/var/log/velaris-egress
    networks:
      - velaris-apps
      - default
    restart: unless-stopped
  # <<< Marketplace Layer-2

networks:
  velaris-apps:
    name: velaris-apps
    driver: bridge
    internal: true
  velaris-apps-edge:
    name: velaris-apps-edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.101.0/24
          gateway: 172.31.101.1

volumes:
  temporal-db:
  velaris-db:
  cache-data:
  events-data:
  ollama-data:
  velaris-minio-data:
  velaris-prometheus-data:
  velaris-mailpit-data:
  openbao-data:
  openbao-file:
  openbao-logs:

