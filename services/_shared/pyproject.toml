[project]
name = "velaris-shared"
version = "0.1.0"
description = "Velaris shared layer — config, database, identity and HxGuard"
requires-python = ">=3.12"
license = "LicenseRef-BSL-1.1"
# Only what the shared layer itself imports. Deliberately narrow: every
# extracted service installs this, so anything added here is added to all of
# them. Feature-only wheels (minio, temporalio, docker, signxml, …) stay in
# case-service.
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "bcrypt>=4.9.9",
    "prometheus-client>=0.20",  # imported by velaris_shared.observability.metrics
    "webauthn>=2.0.0",
    "structlog>=24.1",
    "redis>=5.0",
]

[project.optional-dependencies]
mysql = [
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["velaris_shared"]
