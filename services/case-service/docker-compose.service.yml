# Add this service to your main docker-compose.yml when deploying
# Or use: docker compose -f docker-compose.yml -f services/case-service/docker-compose.service.yml up

services:
  velaris-case-service:
    build:
      # Repo root: the image needs services/_shared (velaris-shared) too.
      context: ../..
      dockerfile: services/case-service/Dockerfile
    ports:
      - "8200:8200"
    environment:
      - VELARIS_CASE_DATABASE_URL=postgresql+asyncpg://velaris:velaris_dev_password@velaris-db:5432/velaris
      - VELARIS_CASE_TEMPORAL_HOST=temporal:7233
      - VELARIS_CASE_DEBUG=false
    depends_on:
      velaris-db:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
