[project]
name = "velaris-hxmigrate-service"
version = "0.1.0"
description = "Velaris hxmigrate-service — scan, import, plan and create"
requires-python = ">=3.12"
license = "LicenseRef-BSL-1.1"
dependencies = [
    "velaris-shared",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28.0",
    "lxml>=5.3",
    "defusedxml>=0.7.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# case-service is a TEST-ONLY dependency: these tests seed fixtures through
# the case API and assert through this service's, so the test client mounts
# both behind an in-process copy of the gateway (see tests/conftest.py). The
# service package itself must never import it — that is test-enforced.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28", "aiosqlite>=0.20", "velaris-case-service"]
mysql = ["aiomysql>=0.2.0", "pymysql>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hxmigrate_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
