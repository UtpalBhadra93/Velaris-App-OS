<?xml version="1.0" encoding="UTF-8"?>
<!-- Microsoft Entra ID's mark, as supplied by the deployment administrator.

     Two changes from the source markup, both deliberate:

     * The construction grid is gone. The original carried ~10 guide shapes
       (bounding rects, circles, the centre lines and diagonals) stroked
       `white` at 0.1 — a design-tool artefact. White-on-white is invisible on
       the light theme, so it looked fine, but the sign-in button inverts the
       icon on the dark theme and every one of those lines would have drawn.
     * `stroke="black"` became `currentColor`, matching okta.svg, so the mark
       follows the page rather than being painted a fixed colour.

     The viewBox is measured, not the source's `0 0 96 96`: `getBBox()` on the
     three paths gives x 14 y 6 w 67.74 h 84.54, and the 4-wide stroke straddles
     that edge, so the inked box is x 12 y 4 w 71.74 h 88.54. Squared off around
     it (side 88.54, centred horizontally) so this mark and Okta's carry the
     same optical weight in the 20px button slot instead of one sitting inside
     a margin of empty grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.6 4 88.54 88.54" role="img" aria-label="Microsoft Entra ID">
  <g fill="none" stroke="currentColor" stroke-width="4">
